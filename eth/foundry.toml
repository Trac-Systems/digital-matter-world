[profile.default]
src = "src"
test = "test"
script = "script"
out = "../../build/target/eth-out"
cache_path = "../../build/target/eth-cache"
broadcast = "../../build/target/eth-broadcast"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 96
fail_on_revert = true
